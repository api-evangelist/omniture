name: Omniture
description: Omniture was a web analytics company founded in 1996 in Orem, Utah and
  backed by Battery Ventures. It went public in 2006 and was acquired by Adobe Systems
  in 2009 for approximately 1.8 billion dollars. Its flagship SiteCatalyst product
  became Adobe Analytics within the Adobe Experience Cloud, and the DataWarehouse and
  reporting interfaces were folded into Adobe's Analytics APIs. The omniture.com domain
  now redirects to adobe.com and no independent Omniture API surface exists. This profile
  is retained as an acquired-company lead in the API Evangelist network.
